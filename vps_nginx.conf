# Rate limiting zone — 10 requests/sec per IP, burst of 20
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

# ------------------------------------------------
# HTTP → HTTPS redirect
# ------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name editor.fitshare.tech backend.fitshare.tech;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------
# EDITOR (FRONTEND + WEBSOCKETS + API PROXY)
# ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name editor.fitshare.tech;

    # SSL Configuration (assuming standard Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/editor.fitshare.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/editor.fitshare.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security: Limit request body size to prevent memory exhaustion
    client_max_body_size 2m;

    # Security: Hide nginx version from responses
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # WebSocket Proxy for Execution Engine
    location /api/v1/execution/ws {
        # Apply rate limit for WS connections (uses auth zone: 3/s)
        limit_req zone=auth burst=5 nodelay;

        # Pass to the Docker Nginx container running on port 8080
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # CRITICAL: Dynamically pass the Upgrade header from the client
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Prevent timeouts during long interactive sessions (30 minutes max)
        proxy_read_timeout 1800;
        proxy_send_timeout 1800;
    }

    # Auth endpoints — stricter rate limiting
    location ~ ^/api/v1/auth/(login|register|reset-password|request-password-reset) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API Proxy
    location /api {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Assets Proxy
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------------------------------
# BACKEND (DIRECT API ACCESS)
# ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend.fitshare.tech;

    ssl_certificate /etc/letsencrypt/live/backend.fitshare.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.fitshare.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security
    client_max_body_size 2m;
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ ^/(login|register|reset-password) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        # Pass directly to the backend API container running on port 8000
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
