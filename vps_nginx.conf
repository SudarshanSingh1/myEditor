server {
    listen 80;
    listen [::]:80;
    server_name editor.fitshare.tech backend.fitshare.tech;
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------
# EDITOR (FRONTEND + WEBSOCKETS + API PROXY)
# ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name editor.fitshare.tech;

    # SSL Configuration (assuming standard Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/editor.fitshare.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/editor.fitshare.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket Proxy for Execution Engine
    location /api/v1/execution/ws {
        # Pass to the Docker Nginx container running on port 8080
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        # CRITICAL: Dynamically pass the Upgrade header from the client
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Prevent timeouts during long interactive sessions
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # REST API Proxy
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Assets Proxy
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------------------------------
# BACKEND (DIRECT API ACCESS)
# ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend.fitshare.tech;

    ssl_certificate /etc/letsencrypt/live/backend.fitshare.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.fitshare.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # Pass directly to the backend API container running on port 8000
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
