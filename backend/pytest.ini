[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
env =
    TESTING=1
    DATABASE_URL=sqlite:///./test.db
    SECRET_KEY=test_secret_key_for_ci_cd_pipeline
    ALGORITHM=HS256
    SMTP_HOST=smtp.mailtrap.io
    SMTP_PORT=2525
    SMTP_USERNAME=test
    SMTP_PASSWORD=test
    SMTP_TLS=True
