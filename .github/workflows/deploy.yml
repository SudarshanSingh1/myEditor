name: CI/CD Pipeline

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI for deployments
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Checks (Frontend & Backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: hamara_editor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Frontend Dependencies
        run: npm ci
        
      - name: Run Frontend Linting
        run: npm run lint
        
      - name: Run Frontend Typecheck
        run: npm run typecheck
        
      - name: Run Frontend Tests
        run: npm run test -- --run --passWithNoTests
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
        
      - name: Run Backend Linting (Ruff)
        working-directory: ./backend
        run: ruff check .
        
      - name: Run Backend Tests
        working-directory: ./backend
        run: pytest tests/api/
        env:
          DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/hamara_editor
          TEST_DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/hamara_editor
          ENVIRONMENT: testing
          JWT_SECRET_KEY: test_secret_key_for_ci_pipeline
          SMTP_API_KEY: fake_smtp_key
        
  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') # Deploys on push to main OR manual trigger
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          # You can define VPS_PROJECT_PATH as a Github Variable (e.g., /root/myeditor)
          # Fallback defaults to '~/myeditor'
          script: |
            PROJECT_PATH="${{ vars.VPS_PROJECT_PATH }}"
            if [ -z "$PROJECT_PATH" ]; then
              PROJECT_PATH="/opt/myEditor"
            fi
            
            echo "Deploying to $PROJECT_PATH"
            cd $PROJECT_PATH
            
            echo "Pulling latest code from main branch..."
            git pull origin main
            
            echo "Validating Docker installation..."
            if ! command -v docker &> /dev/null; then
              echo "Error: docker is not installed."
              exit 1
            fi
            if ! docker compose version &> /dev/null; then
              echo "Error: docker compose is not installed."
              exit 1
            fi

            echo "Validating environment file..."
            ENV_FILE=".env.production"
            if [ ! -f "$ENV_FILE" ]; then
              if [ -f ".env" ]; then
                echo "Warning: .env.production not found. Using existing .env instead."
                ENV_FILE=".env"
              else
                echo "Error: Neither .env.production nor .env found! Deployment aborted."
                exit 1
              fi
            fi

            echo "Validating required variables..."
            for var in DATABASE_URL POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB SECRET_KEY; do
              if ! grep -q "^${var}=" "$ENV_FILE"; then
                if [ "$var" = "SECRET_KEY" ] && grep -q "^JWT_SECRET_KEY=" "$ENV_FILE"; then
                   continue
                fi
                echo "Error: Required variable $var is missing or empty in $ENV_FILE"
                exit 1
              fi
            done
            
            PARSED_APP_ENV=$(grep -E '^APP_ENV=' "$ENV_FILE" | cut -d= -f2- | tr -d '"'\'' ' | xargs)
            PARSED_DATABASE_URL=$(grep -E '^DATABASE_URL=' "$ENV_FILE" | cut -d= -f2-)
            PARSED_DATABASE_HOST=$(echo "$PARSED_DATABASE_URL" | sed -n 's|.*@\([^:/]*\).*|\1|p')
            PARSED_DATABASE_NAME=$(echo "$PARSED_DATABASE_URL" | sed -n 's|.*/\([^?]*\).*|\1|p')
            
            echo "========================================="
            echo "PRE-DEPLOYMENT ENVIRONMENT CHECK"
            echo "ENV FILE USED: $ENV_FILE"
            echo "APP_ENV: $PARSED_APP_ENV"
            echo "DATABASE_HOST: $PARSED_DATABASE_HOST"
            echo "DATABASE_NAME: $PARSED_DATABASE_NAME"
            echo "========================================="
            
            if [ "$PARSED_APP_ENV" != "production" ]; then
              echo "Error: APP_ENV is not set to production in $ENV_FILE. Aborting to protect database from dev seeds."
              exit 1
            fi
            
            if [ "$PARSED_DATABASE_HOST" = "localhost" ] || [ "$PARSED_DATABASE_HOST" = "127.0.0.1" ] || [ "$PARSED_DATABASE_HOST" = "host.docker.internal" ]; then
              echo "Error: DATABASE_HOST points to a local address ($PARSED_DATABASE_HOST). Aborting."
              exit 1
            fi
            
            echo "Running pre-deployment row-count verification..."
            DB_CONTAINER=$(docker compose -f docker-compose.prod.yml ps -q db 2>/dev/null || echo "")
            if [ -n "$DB_CONTAINER" ] && docker inspect -f '{{.State.Running}}' "$DB_CONTAINER" | grep -q "true"; then
               DB_USER=$(grep -E '^POSTGRES_USER=' "$ENV_FILE" | cut -d= -f2-)
               DB_NAME=$(grep -E '^POSTGRES_DB=' "$ENV_FILE" | cut -d= -f2-)
               
               PRE_USERS=$(docker exec "$DB_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT count(*) FROM users;" 2>/dev/null | xargs || echo "0")
               PRE_PROJECTS=$(docker exec "$DB_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT count(*) FROM projects;" 2>/dev/null | xargs || echo "0")
               PRE_LOGS=$(docker exec "$DB_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT count(*) FROM execution_logs;" 2>/dev/null | xargs || echo "0")
               
               echo "Pre-deploy Counts -> Users: $PRE_USERS | Projects: $PRE_PROJECTS | ExecLogs: $PRE_LOGS"
            else
               echo "Database container not running yet. Skipping pre-deploy count."
               PRE_USERS="N/A"
            fi

            export ENV_FILE

            echo "Validating compose configuration..."
            if ! ENV_FILE="$ENV_FILE" docker compose -f docker-compose.prod.yml config -q; then
              echo "Error: Invalid docker compose configuration."
              exit 1
            fi

            echo "Validating Nginx configuration..."
            if command -v nginx &> /dev/null; then
               if ! sudo -n nginx -t; then
                  echo "Error: Nginx configuration test failed or requires interactive sudo password. Aborting."
                  exit 1
               fi
            fi
            
            echo "Rebuilding and restarting docker containers..."
            ENV_FILE="$ENV_FILE" docker compose -f docker-compose.prod.yml up --build -d
            
            echo "Waiting for services to become healthy..."
            sleep 15
            
            if [ "$PRE_USERS" != "N/A" ]; then
               echo "Running post-deployment row-count verification..."
               DB_CONTAINER=$(docker compose -f docker-compose.prod.yml ps -q db 2>/dev/null)
               
               POST_USERS=$(docker exec "$DB_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT count(*) FROM users;" 2>/dev/null | xargs || echo "0")
               POST_PROJECTS=$(docker exec "$DB_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT count(*) FROM projects;" 2>/dev/null | xargs || echo "0")
               POST_LOGS=$(docker exec "$DB_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT count(*) FROM execution_logs;" 2>/dev/null | xargs || echo "0")
               
               echo "Post-deploy Counts -> Users: $POST_USERS | Projects: $POST_PROJECTS | ExecLogs: $POST_LOGS"
               
               if [ "$PRE_USERS" != "$POST_USERS" ] || [ "$PRE_PROJECTS" != "$POST_PROJECTS" ] || [ "$PRE_LOGS" != "$POST_LOGS" ]; then
                  echo "CRITICAL ERROR: Database row counts changed during deployment! Data loss may have occurred."
                  exit 1
               fi
               echo "Row-count verification passed. Integrity confirmed."
            fi
            
            echo "Performing HTTP health checks..."
            BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/docs || echo "000")
            if [ "$BACKEND_STATUS" != "200" ]; then
               echo "Error: Backend failed to start (HTTP $BACKEND_STATUS)."
               exit 1
            fi
            
            FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ || echo "000")
            if [ "$FRONTEND_STATUS" != "200" ]; then
               echo "Error: Frontend failed to start (HTTP $FRONTEND_STATUS)."
               exit 1
            fi
            
            echo "Pruning old docker images to free up space..."
            docker image prune -af
            
            echo "Deployment successful! Application is ready."
