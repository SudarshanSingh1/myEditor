<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hBody" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded square background -->
  <rect width="512" height="512" rx="96" fill="#1e293b"/>

  <!-- H letter - left vertical stroke -->
  <rect x="100" y="80" width="72" height="352" rx="8" fill="url(#hBody)"/>

  <!-- H letter - horizontal crossbar -->
  <rect x="100" y="216" width="240" height="72" rx="8" fill="url(#hBody)"/>

  <!-- H letter - right vertical stroke (upper portion) -->
  <rect x="268" y="80" width="72" height="136" rx="8" fill="url(#hBody)"/>

  <!-- H letter - right vertical stroke (lower portion, below crossbar) -->
  <rect x="268" y="288" width="72" height="144" rx="8" fill="url(#hBody)"/>

  <!-- Folded corner on the right stroke (top-right) -->
  <path d="M290 80 L340 80 L340 130 Z" fill="url(#fold)"/>

  <!-- Code brackets </> -->
  <g fill="none" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- < bracket -->
    <polyline points="198,348 168,372 198,396"/>
    <!-- > bracket -->
    <polyline points="282,348 312,372 282,396"/>
    <!-- / slash -->
    <line x1="254" y1="340" x2="226" y2="404"/>
  </g>
</svg>
